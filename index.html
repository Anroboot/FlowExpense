<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker — Управление финансами</title>
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon">💰</div>
                <span class="logo-text">FlowExpense</span>
            </div>
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-item active" data-tab="dashboard">
                    <span class="icon">📊</span>
                    <span class="text">Дашборд</span>
                </a>
                <a href="#expenses" class="nav-item" data-tab="expenses">
                    <span class="icon">💳</span>
                    <span class="text">Расходы</span>
                </a>
            </nav>
            <div class="theme-toggle-container">
                <button id="themeToggle" class="theme-btn" aria-label="Сменить тему">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-text">Тёмная тема</span>
                </button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Верхняя панель -->
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <h1 id="pageTitle">Дашборд</h1>
                <button class="btn btn-primary" id="openAddModalBtn">+ Новый расход</button>
            </header>

            <div class="content-body">
                <!-- Вкладка: Дашборд -->
                <section id="dashboardTab" class="tab-content active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-header">
                                <span>Всего потрачено</span>
                                <span class="stat-icon">💵</span>
                            </div>
                            <div class="stat-value" id="totalExpenses">0 ₽</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <span>Расходы за этот месяц</span>
                                <span class="stat-icon">📅</span>
                            </div>
                            <div class="stat-value" id="monthlyExpenses">0 ₽</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <span>Всего транзакций</span>
                                <span class="stat-icon">🔢</span>
                            </div>
                            <div class="stat-value" id="totalCount">0</div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="card chart-card">
                            <h3>Категории расходов</h3>
                            <div class="chart-container" id="categoryChart"></div>
                        </div>
                        <div class="card recent-card">
                            <h3>Последние операции</h3>
                            <div id="recentList" class="recent-list"></div>
                        </div>
                    </div>
                </section>

                <!-- Вкладка: Список расходов -->
                <section id="expensesTab" class="tab-content">
                    <div class="card filters-card">
                        <div class="filters-grid">
                            <div class="filter-group">
                                <label for="searchInput">Поиск</label>
                                <input type="text" id="searchInput" placeholder="Поиск по описанию...">
                            </div>
                            <div class="filter-group">
                                <label for="categoryFilter">Категория</label>
                                <select id="categoryFilter">
                                    <option value="ALL">Все категории</option>
                                    <option value="Еда">Еда</option>
                                    <option value="Транспорт">Транспорт</option>
                                    <option value="Покупки">Покупки</option>
                                    <option value="Развлечения">Развлечения</option>
                                    <option value="Здоровье">Здоровье</option>
                                    <option value="Другое">Другое</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="sortBy">Сортировка</label>
                                <select id="sortBy">
                                    <option value="date-desc">Дата (сначала новые)</option>
                                    <option value="date-asc">Дата (сначала старые)</option>
                                    <option value="amount-desc">Сумма (по убыванию)</option>
                                    <option value="amount-asc">Сумма (по возрастанию)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="card table-card">
                        <div class="table-responsive">
                            <table class="expenses-table">
                                <thead>
                                    <tr>
                                        <th>Дата</th>
                                        <th>Категория</th>
                                        <th>Описание</th>
                                        <th>Сумма</th>
                                        <th class="text-right">Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="expensesTableBody"></tbody>
                            </table>
                        </div>
                        <div id="emptyState" class="empty-state hidden">
                            <p>Операций не найдено</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Модальное окно добавления/редактирования -->
    <div class="modal" id="expenseModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить расход</h2>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="expenseForm">
                <input type="hidden" id="expenseId">
                <div class="form-group">
                    <label for="amountInput">Сумма (₽)</label>
                    <input type="number" id="amountInput" step="0.01" min="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="categorySelect">Категория</label>
                    <select id="categorySelect" required>
                        <option value="Еда">Еда</option>
                        <option value="Транспорт">Транспорт</option>
                        <option value="Покупки">Покупки</option>
                        <option value="Развлечения">Развлечения</option>
                        <option value="Здоровье">Здоровье</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dateInput">Дата</label>
                    <input type="date" id="dateInput" required>
                </div>
                <div class="form-group">
                    <label for="descriptionInput">Описание</label>
                    <input type="text" id="descriptionInput" required placeholder="Например: Обед в кафе">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ⬇️ JavaScript подключен здесь ⬇️ -->
    <script src="app.js"></script>
</body>
</html>
